services:
  fission-andromeda-env:
    image: ghcr.io/lucsoft/fission-andromeda-env:0.1.0
    build:
      context: tools/fission-andromeda-env
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
  fission-porffor-env:
    image: ghcr.io/lucsoft/fission-porffor-env:0.1.0
    build:
      context: tools/fission-porffor-env
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
  mc-router-scaler:
    image: ghcr.io/lucsoft/mc-router-scaler:0.1.1
    build:
      context: tools/mc-router-scaler
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
  pkl-packages:
    image: ghcr.io/lucsoft/pkl-packages:latest
    build:
      context: pkl-packages
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
  pkl-argo-plugin:
    image: ghcr.io/lucsoft/argo-pkl-plugin:0.32.1
    build:
      context: pkl-argo-plugin
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
