clusterName: hmsys.de
talosVersion: v1.13.9
kubernetesVersion: v1.34.2
endpoint: https://49.13.88.50:6443
allowSchedulingOnControlPlanes: true
nodes:
  - hostname: hetzner-hmsys-fsn1-1
    ipAddress: 49.13.88.50
    installDisk: /dev/sda
    controlPlane: true
    machineSpec:
      mode: hcloud
    schematic:
      customization:
        systemExtensions:
          officialExtensions:
            - siderolabs/qemu-guest-agent
    nodeLabels:
      topology.kubernetes.io/region: europe-west
      topology.kubernetes.io/zone: ad-3

patches:
  - |
    cluster:
      externalCloudProvider:
        enabled: true
  - |
    machine:
      kubelet:
        extraConfig:
          memorySwap:
            swapBehavior: LimitedSwap
  # Autoscaled workers get no hcloud private network, so flannel's VXLAN would otherwise cross the
  # public internet in cleartext. KubeSpan wraps all node-to-node traffic in WireGuard; peers find
  # each other through the discovery service, which only ever sees encrypted peer data.
  - |
    machine:
      network:
        kubespan:
          enabled: true
    cluster:
      discovery:
        enabled: true
  - |
    apiVersion: v1alpha1
    kind: ZswapConfig
    maxPoolPercent: 40
